[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# keep the build tools and review files off the public site
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/review/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
