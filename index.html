<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matryo</title>
<meta name="description" content="A daily word game: name as many things as you can, each one a little smaller than the last.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<script>
// pick the theme before anything paints: saved choice, else the device setting
(function(){var t;try{t=JSON.parse(localStorage.getItem('snug:theme'))}catch(e){}
  if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t})();
</script>
<style>
/* Matryo v0.1 · "A Offset" design: 2px borders, hard offset shadows, one orange accent.
   Orange is only ever a fill or a shadow with dark text on it, or (as --acc-text) small bold text
   in a shade that passes 4.5:1 on that theme's background. */
:root,:root[data-theme="light"]{
  --bg:#EFEEEA;--ink:#222220;--mut:#5F5E5A;--card:#F7F6F2;--line:#D6D5CF;
  --acc:#EA5D00;--acc-ink:#222220;--acc-text:#B84000;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#1E1E1C;--ink:#ECEBE6;--mut:#A3A29C;--card:#262624;--line:#3A3A37;
  --acc:#EA5D00;--acc-ink:#1E1E1C;--acc-text:#EA5D00;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
a{color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.field:focus-within{outline:none}
button[disabled]{opacity:.45;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}

.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:20px 20px 18px;display:flex;flex-direction:column;gap:18px}
.spacer{flex:1}

/* buttons */
.btn{height:56px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);box-shadow:4px 4px 0 var(--ink);
  font-weight:700;font-size:17px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none}
.btn.main{height:60px;background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--acc);justify-content:space-between;font-size:18px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.main:active{box-shadow:2px 2px 0 var(--acc)}
.btn small{font-weight:500;font-size:14px;opacity:.85}
.sq{height:40px;min-width:40px;border:2px solid var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:0 12px;font-weight:700;font-size:14px}
.sq.icon{padding:0;width:40px}
.tag{display:inline-block;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 10px;font-size:13px;font-weight:700;
  background:var(--acc);color:var(--acc-ink)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.5px;text-decoration:none;background:none;border:0;padding:0}
.logo .m{display:inline-flex;width:26px;height:26px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);align-items:center;justify-content:center;
  font-size:13px;background:var(--acc);color:var(--acc-ink)}
.nav .r{display:flex;gap:8px}
.sun,.moon{display:none}
:root[data-theme="light"] .sun,:root[data-theme="dark"] .moon{display:block}

/* boxes */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:2px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.card{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--card);padding:16px}

/* home */
.daily{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.daily h1{margin:0;font-size:52px;line-height:1;letter-spacing:-2px}
.daily p{margin:0;font-size:16px;max-width:34ch}
.fine{font-size:13px;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center}
.cta{display:flex;flex-direction:column;gap:12px}
.main-col,.side-col{display:flex;flex-direction:column;gap:12px}
.page.home{display:contents}
.howlink{font-size:14px;font-weight:500}
.narrow{display:flex;flex-direction:column;gap:16px}

/* play */
.playtop{display:flex;align-items:center;gap:10px}
.timer{font-size:28px;font-weight:700}
.pts{margin-left:auto}
.bar{height:10px;border:2px solid var(--ink)}
.bar>div{height:100%;background:var(--ink);transition:width .1s linear}
.bar.low>div{background:var(--acc)}
.ctx{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:500}
.chips span{border:2px solid var(--ink);padding:2px 7px}
.chips span:last-child{background:var(--ink);color:var(--bg)}
.big{font-size:42px;line-height:1;font-weight:700;letter-spacing:-1.5px;overflow-wrap:anywhere}
.field{position:relative;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--acc);
  font-size:22px;font-weight:500;background:var(--card);cursor:text}
.field input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;background:transparent}
.mirror{white-space:pre;overflow:hidden}
.caret{width:2px;height:24px;background:var(--ink);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fb{min-height:28px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fb b{font-size:20px}
.fb span{font-size:13px;color:var(--mut)}
.fb .rare{color:var(--acc-text);font-weight:700}
.fb.no span{color:var(--ink);font-size:14px;font-weight:500}
.count{font-size:44px;font-weight:700;letter-spacing:-1px}
.side{display:none}
.keep{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}

/* results */
.score{font-size:56px;line-height:.95;letter-spacing:-2px;font-weight:700}
.sumrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sumrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--mut);text-align:right}
.sumrow .r b{color:var(--ink);font-size:18px}
.path{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.prow .i{width:18px;font-size:13px;color:var(--mut)}
.prow .w{flex:1;min-width:0}
.prow .t{font-size:12px;color:var(--mut)}
.prow .rare{font-size:12px;font-weight:700;color:var(--acc-text)}
.prow.start{color:var(--mut)}
.range{border:2px solid var(--ink);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.range div{display:flex;flex-direction:column}
.range b{font-size:20px;line-height:1.2}
.range span{font-size:12px;color:var(--mut)}
.share{border:2px dashed var(--mut);padding:10px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;user-select:all}
.badge-new{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--acc);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.badge-new span{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ladder{display:flex;flex-direction:column;font-size:15px}
.ladder div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ladder .you{font-weight:700}
.ladder .x{color:var(--mut)}

/* menu, help, admin */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head h2{margin:0;font-size:34px;letter-spacing:-1px;line-height:1}
.list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 2px;border:0;border-bottom:1px solid var(--line);
  background:transparent;font-size:15px;text-align:left;width:100%}
.lrow b{font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border:2px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.badge b{font-size:15px}
.badge.on{border:2px solid var(--ink);color:var(--ink)}
.badge.on b::before{content:"★ ";color:var(--acc-text)}
.help h3{margin:8px 0 0;font-size:12px;letter-spacing:1.5px;color:var(--mut);font-weight:500}
.help p,.help li{margin:0;font-size:16px;max-width:60ch}
.help ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pt{width:100%;border-collapse:collapse;font-size:15px}
.pt td,.pt th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.pt th{font-size:12px;letter-spacing:1px;color:var(--mut);font-weight:500;border-bottom:2px solid var(--ink)}
.pt td:last-child,.pt th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.toggle{width:46px;height:26px;border:2px solid var(--ink);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--ink)}
.toggle.on{background:var(--acc)} .toggle.on::after{left:22px;background:var(--acc-ink)}
.note{font-size:14px;color:var(--mut)}
.tablewrap{overflow-x:auto}

/* motion: things slide in on arrival, out when a round starts */
@keyframes slideIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateY(-14px);opacity:0}}
@keyframes pop{from{transform:translateY(5px);opacity:.3}to{transform:none;opacity:1}}
.in{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms)}
.out{animation:slideOut .25s ease-in both;animation-delay:calc(var(--d,0) * 35ms)}
.pop{animation:pop .2s ease-out}
.calm .in,.calm .out,.calm .pop,.calm .caret{animation:none!important}
@media (prefers-reduced-motion:reduce){.in,.out,.pop,.caret{animation:none!important}}

/* desktop */
@media (min-width:900px){
  .app{max-width:1120px;padding:0 32px 0;gap:0}
  .nav{padding:18px 0;margin:0 -32px;padding-inline:32px}
  .page{flex:1;display:flex;flex-wrap:wrap;gap:64px;align-items:center;padding:64px 0}
  .page.home{display:flex}
  .home .main-col{order:-1}
  .home .spacer{display:none}
  .page>.main-col{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .page>.side-col{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:14px}
  .home .daily h1{font-size:96px;letter-spacing:-4px;line-height:.95}
  .home .daily p{font-size:20px;max-width:560px}
  .home .cta{flex-direction:row;flex-wrap:wrap;gap:16px}
  .home .cta .btn{padding:0 28px}
  .home .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home .stats .stat:first-child{grid-column:1/-1;box-shadow:5px 5px 0 var(--ink);background:var(--card);padding:18px 20px}
  .home .stats .stat:first-child b{font-size:40px}
  .footer{border-top:2px solid var(--ink);margin:0 -32px;padding:18px 32px;text-align:left}
  .page.play{align-items:flex-start}
  .play .big{font-size:96px;letter-spacing:-4px}
  .play .field{height:72px;font-size:30px;max-width:640px;box-shadow:6px 6px 0 var(--acc)}
  .play .chips{display:none}
  .side{display:flex;flex-direction:column;border:2px solid var(--ink);padding:18px 20px}
  .side .prow{font-size:16px}
  .narrow{max-width:720px;margin:0 auto;width:100%;padding:40px 0;display:flex;flex-direction:column;gap:18px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input class="keep" id="keep" tabindex="-1" aria-hidden="true" autocapitalize="off">
<!-- optional: config.js can point the game at its server functions; the game runs without them -->
<script src="config.js" onerror="void 0"></script>
<script>
// =====================================================================
// Matryo v0.1 — name smaller and smaller things from today's place
// Data: data/words.json (word, exact size, commonness…), data/dailies.json, data/categories.json
// Server: Netlify functions + Netlify Blobs storage (netlify/functions); the game still works without them
// =====================================================================
const CFG=Object.assign({api:'/.netlify/functions'},window.MATRYO_CONFIG||{});
const API=CFG.api;   // Netlify server functions: logging, shared stats, words added after launch
const VERSION='0.1';
const DAILY_SECONDS=60, HEADSTART_MS=1500, MAX_PAUSES=2;
// sizes are on a scale where 1 size = 1.5x. A step's points come from how far down it goes:
//   less than 1 size smaller (but at least ~10%)  = perfect fit
//   within ~10% (NEAR) and still smaller          = snug fit
//   1..6 sizes                                    = 100..25; 7+ sizes is too big a jump
//   same size but a kind of the last thing         = "kind of" step (DOCTOR after PERSON)
const NEAR=0.26, MAX_STEPS=6;
// a word's points add up, and no word scores more than 100:
//   fit (50 perfect … 10 for 6 sizes, 25 kind of) + on theme 20 + specific 5 per level (max 15) + rare up to 15
//   played in the last 7 days: half to full, recovering over the week
const STEP_PTS={0:50,1:40,2:30,3:25,4:20,5:15,6:10}, KIND_PTS=25, MAX_PTS=100;
const THEME_PTS=20, SPEC_PTS=5, SPEC_MAX=15, THEME_MULT=1.5, COOLDOWN_DAYS=7, MIN_PLAYS_FOR_STATS=25;
const rarePts=r=>r>=2?15:r>=1.6?10:r>=1.3?5:0;
const SITE='https://playsmidgen.com/?utm_source=matryo&utm_medium=game&utm_campaign=footer';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=w=>{const s=String(w).replace(/_/g,' ');return s.length<=2?s.toUpperCase():s.charAt(0).toUpperCase()+s.slice(1)};   // first_aid_kit → First aid kit
const TC=s=>String(s).toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());                  // A HOSPITAL → A Hospital
const pad3=n=>String(n).padStart(3,'0');
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmt=n=>Number(n).toLocaleString('en-US');
const ICON={
  sun:'<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  pause:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>',
  copy:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
};

// ---------- saved per-player stuff (keys keep the old "snug:" prefix); the game works without it ----------
const store={get(k,d){try{const v=localStorage.getItem('snug:'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},
  set(k,v){try{localStorage.setItem('snug:'+k,JSON.stringify(v))}catch(_){}},
  del(k){try{localStorage.removeItem('snug:'+k)}catch(_){}}};
const SET=Object.assign({motion:true},store.get('settings',{}));
function applySettings(){document.documentElement.classList.toggle('calm',!SET.motion)}
applySettings();
const reduced=()=>!SET.motion||matchMedia('(prefers-reduced-motion: reduce)').matches;
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('theme',t)}
const saved=n=>store.get('v01:'+n,null);          // finished dailies (v0.1 scoring)
const liveSaved=n=>store.get('live:'+n,null);     // a daily that was paused or left mid-round
function clearResults(){try{Object.keys(localStorage).filter(k=>/^snug:(best|result|r8|v01|recent|live|badges)/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(_){}}
// anonymous id for this device, so admin stats can count unique visitors without accounts
const DEVICE=(()=>{let d=store.get('device',null);if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());store.set('device',d)}return d})();
const todayISO=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

// ---------- data ----------
let ALIAS={},RANK=()=>50,EX={},TIER={},ALTS={},POP={},PARENT={},SPECD={},SQUASH={},KEYS=[],DAILIES=[],CATS=[],TODAY=null,MIN_EX=1;
function addWord(w,x,p,spec,parent,alts){
  EX[w]=x;TIER[w]=Math.round(x);POP[w]=p;if(parent){PARENT[w]=parent;SPECD[w]=spec||1}if(alts&&alts.length)ALTS[w]=alts;
  SQUASH[w.replace(/_/g,'')]=w;
}
async function loadData(){
  const [w,d,c]=await Promise.all(['words','dailies','categories'].map(f=>fetch(`data/${f}.json`).then(r=>r.json())));
  for(const r of w.words)addWord(r[0],r[1],r[2],r[3],r[4],r[5]);
  ALIAS=w.aliases||{};   // other everyday names: MED KIT -> FIRST AID KIT
  // words added after launch: by you in admin.html, or automatically once enough players type the same word in a day
  if(API){
    try{
      const extra=await fetch(`${API}/words`).then(r=>r.ok?r.json():[]);
      for(const x of extra){
        if(EX[x.word]!=null)continue;
        const own=x.size_cm?Math.max(1,Math.round((Math.log(x.size_cm/0.001)/Math.log(1.5)+1)*100)/100):+x.tier;
        const parent=x.parent&&EX[x.parent]!=null?x.parent:null;   // a kind of another word: same size unless you gave it one
        addWord(x.word,own||(parent?EX[parent]:1),+x.pop||2,parent?1:0,parent);
      }
    }catch(_){}
  }
  KEYS=Object.keys(EX);DAILIES=d;CATS=c;MIN_EX=Math.min(...KEYS.map(k=>EX[k]));
  // share of everyday words (not the extra-specific ones) that are more common than this one in English
  const sorted=KEYS.filter(k=>!PARENT[k]).map(k=>POP[k]).sort((a,b)=>a-b);
  RANK=k=>{let lo=0,hi=sorted.length;while(lo<hi){const m=(lo+hi)>>1;if(sorted[m]<=POP[k])lo=m+1;else hi=m}return Math.round(100*(1-lo/sorted.length))};
  const iso=todayISO(),idx=d.findIndex(x=>x.date>iso);
  TODAY=d.find(x=>x.date===iso)||(idx===-1?d[d.length-1]:d[Math.max(0,idx-1)]);
}
const fmtDate=iso=>{const [y,m,dd]=iso.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd)};
// how many steps more specific than an everyday word (DEMITASSE: coffee cup → cup = 2)
function specificity(w){let d=0,x=w,g=0;while(PARENT[x]&&g++<6){d+=SPECD[x];x=PARENT[x]}return d}
function roots(w){const out=[w];let x=w,g=0;while(PARENT[x]&&g++<6){x=PARENT[x];out.push(x)}return out}

// ---------- matching: exact, plural, no-space, the main word of a phrase, then 1–2 typos ----------
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const c=[i];let lo=i;for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));lo=Math.min(lo,c[j])}if(lo>2)return 9;p=c}return p[n]}
function look(x){
  const one=y=>EX[y]!=null?y:(ALIAS[y]||SQUASH[y.replace(/_/g,'')]||null);
  const hit=one(x);if(hit)return hit;
  for(const [end,rep] of [['ies','y'],['ves','f'],['es',''],['s','']])if(x.endsWith(end)){const y=one(x.slice(0,-end.length)+rep);if(y)return y}
  return null;
}
function norm(raw){
  const w=raw.toLowerCase().replace(/[^a-z' -]/g,'').replace(/'/g,'').replace(/[\s-]+/g,' ').trim().replace(/^(a|an|the|some|my|your) /,'').replace(/ /g,'_');
  if(!w)return null;
  const exact=look(w);if(exact)return{w:exact};
  // a made-up phrase like GIANT CUP counts as its main word (CUP), without the specific bonus
  const parts=w.split('_');
  if(parts.length>1){for(let i=1;i<parts.length;i++){const tail=look(parts.slice(i).join('_'));if(tail)return{w:tail,from:'phrase'}}}
  if(w.length<4)return null;
  const max=w.length>=8?2:1;let bestK=null,bd=9;
  for(const k of KEYS){if(Math.abs(k.length-w.length)>max)continue;const d=lev(w,k);if(d<bd){bd=d;bestK=k;if(d===1&&max===1)break}}
  return bd<=max?{w:bestK,from:'typo'}:null;
}

// ---------- scoring ----------
// how a new word fits under the current one; null fit = not allowed, with a reason
function fit(w,cur,curEx){
  const sizes=[EX[w],...(ALTS[w]||[])].filter(s=>s<curEx).sort((a,b)=>b-a);   // biggest size that is still smaller
  const kind=roots(w).slice(1).includes(cur);                                    // DOCTOR is a kind of PERSON
  if(sizes.length){
    const s=sizes[0],d=curEx-s;
    if(d<NEAR)return{size:s,kind:'snug',base:STEP_PTS[1]};
    const steps=d<1?0:Math.floor(d);
    if(steps>MAX_STEPS)return{no:'bigger'};
    return{size:s,kind:steps===0?'perfect':steps===1?'snug':steps<=2?'tight':steps<=4?'good':'big',base:STEP_PTS[steps],steps};
  }
  if(kind)return{size:curEx,kind:'kind',base:KIND_PTS};
  const near=[EX[w],...(ALTS[w]||[])].some(s=>s-curEx<NEAR);
  return{no:near?'same':'notsmaller'};
}
const FIT_LABEL={perfect:'perfect fit',snug:'snug fit',tight:'tight fit',good:'good fit',big:'big step',kind:'kind of'};
const FIT_BLOCK={perfect:'⭐',snug:'🟦',tight:'🟨',good:'🟨',big:'⬜',kind:'🔹'};
const hasStats=()=>STATS&&STATS_N>=MIN_PLAYS_FOR_STATS;
// rare: uncommon in everyday English now; once a puzzle has 25+ rounds, uncommon among players
function rarity(w){
  if(hasStats()){const pc=STATS[w]||0;return pc<=2?2:pc<=5?1.6:pc<=10?1.3:pc<=20?1:pc<=35?.8:.6}
  return Math.min(2,Math.max(.6,Math.round((2.2-POP[w]*.3)*10)/10));
}
// the % shown next to a rare word: share of players once there are enough, otherwise how uncommon it is in English
const rareLabel=w=>hasStats()?`only ${STATS[w]||0}% of players`:`rarer than ${RANK(w)}% of words`;
const specMult=w=>Math.min(2,1+.25*specificity(w));
function onTheme(w,theme){return theme&&roots(w).some(x=>theme.has(x))}
function cooldown(w){ // played in the last 7 days: worth half, recovering a little each day
  const last=store.get('recent',{})[w];if(!last)return 1;
  const days=Math.round((new Date(todayISO())-new Date(last))/864e5);
  return days>=COOLDOWN_DAYS?1:Math.round((.5+.5*days/COOLDOWN_DAYS)*10)/10;
}
function remember(words){const r=store.get('recent',{}),t=todayISO();words.forEach(w=>r[w]=t);
  for(const k in r)if((new Date(t)-new Date(r[k]))/864e5>COOLDOWN_DAYS)delete r[k];store.set('recent',r)}

function log(kind,payload){

}
let STATS=null,STATS_N=0,STATS_FOR=null;
async function loadStats(n){
  STATS=null;STATS_N=0;if(!n||!API)return;
  try{const s=await fetch(`${API}/stats?n=${n}`).then(r=>r.ok?r.json():null);if(s&&s.plays){STATS=s.pct||{};STATS_N=s.plays}}catch(_){}
}

function puzzleFor(d){const c=CATS.find(x=>x.cat===d.cat)||{words:[]};return{...d,theme:new Set(c.words)}}
// the smallest thing on the place's own list (PILL for a hospital)
function smallestOnTheme(r){let best=null;for(const k of r.theme)if(EX[k]!=null&&(!best||EX[k]<EX[best]))best=k;return best}

function streak(){ // days in a row with a played daily, counting back from today (or yesterday if today isn't played yet)
  const played=new Set(history().map(x=>x.d.date));let n=0,day=new Date(TODAY.date+'T12:00');

}

// ---------- round ----------
function leave(r,resume){
  // open the keyboard now, inside the tap, so phones allow it; the real input takes focus once the round screen exists
  document.getElementById('keep').focus();
  const els=[...app.querySelectorAll('.in')].filter(el=>!el.parentElement.closest('.in'));
  els.forEach((el,i)=>{el.classList.remove('in');el.style.setProperty('--d',Math.min(i,8));el.classList.add('out')});
  setTimeout(()=>startRound(r,resume),reduced()?0:250+Math.min(els.length,8)*35);
}
function saveLive(){ // dailies only: what's needed to resume, and to stop a reload from restarting the clock
  if(!S||S.r.quick)return;

}

     ...(resume?{chain:resume.chain,score:resume.score,cur:resume.cur,curEx:resume.curEx,used:new Set(resume.used),left:resume.left,pauses:resume.pauses}:{})};

function startClock(){
  if(!S||S.clock)return;
  S.clock=true;S.live=true;S.end=Date.now()+S.left;
  const fb=document.getElementById('fb');if(fb&&fb.querySelector('.count'))fb.innerHTML='';

    const left=Math.max(0,S.end-Date.now()),s=Math.ceil(left/1000);
    document.getElementById('t').textContent=clock(s);
    const bar=document.getElementById('bar');
    bar.firstElementChild.style.width=(left/(S.secs*10))+'%';
    bar.classList.toggle('low',s<=10);
    if(++n%10===0)saveLive();
    if(!left)finish('time');
  },100);
}
function pause(){
  if(!S)return;
  if(S.r.quick){ // quick play: pause as often as you like, kept until you leave the page
    S.left=S.clock?Math.max(0,S.end-Date.now()):S.left;clearInterval(tick);
    QUICK={r:S.r,chain:S.chain,score:S.score,cur:S.cur,curEx:S.curEx,used:[...S.used],left:S.left,pauses:0};S=null;showStart();return;
  }
  if(S.pauses>=MAX_PAUSES){
    const b=document.getElementById('pause');
    if(!b.dataset.armed){b.dataset.armed='1';say('no','Pausing again ends your daily. Tap pause once more to end it.');setTimeout(()=>{delete b.dataset.armed},4000);return}
    return finish('paused');
  }
  S.left=S.clock?Math.max(0,S.end-Date.now()):S.left;clearInterval(tick);
  S.pauses++;S.clock=false;S.live=false;saveLive();S=null;showStart();
}

function submit(raw){
  if(!raw.trim()||!S||!S.live)return;
  const hit=norm(raw),r=S.r,typed=raw.trim();
  if(!hit){log('miss',{word:typed.toLowerCase().slice(0,40),puzzle:r.n||null,container:S.cur,containerSize:S.curEx,device:DEVICE});return say('no',`"${typed}" isn't in our list yet. Try an everyday name.`)}
  const w=hit.w,note=hit.from?`${typed} → ${W(w)}. `:'';
  if(S.used.has(w))return say('no',note+`${W(w)} is already used.`);
  const f=fit(w,S.cur,S.curEx);
  if(f.no==='bigger')return say('no',note+`${W(w)} is too small. Think bigger.`);
  if(f.no==='same')return say('no',note+`${W(w)} is about the same size as ${W(S.cur).toLowerCase()}. Go a little smaller.`);
  if(f.no)return say('no',note+`${W(w)} isn't smaller than ${W(S.cur).toLowerCase()}.`);
  const m={rare:rarity(w),spec:hit.from==='phrase'?1:specMult(w),theme:onTheme(w,r.theme)?THEME_MULT:1,cool:cooldown(w)};
  const bonus=(m.theme>1?THEME_PTS:0)+(hit.from==='phrase'?0:Math.min(SPEC_MAX,SPEC_PTS*specificity(w)))+rarePts(m.rare);
  const p=Math.max(5,Math.min(MAX_PTS,Math.round((f.base+bonus)*m.cool/5)*5));
  S.score+=p;S.chain.push({w,p,kind:f.kind,...m});S.used.add(w);S.cur=w;S.curEx=f.size;
  const tags=[FIT_LABEL[f.kind],m.spec>1&&'specific',m.theme>1&&'on theme',m.cool<1&&'played recently'].filter(Boolean).map(esc);
  if(m.rare>=1.3)tags.push(`<span class="rare">${esc(rareLabel(w))}</span>`);
  say('ok',`+${p}`,esc(note+W(w))+' · '+tags.join(' · '));
  drawPlay();saveLive();
  // nothing in the list is smaller than this: the run is over
  if(S.curEx-MIN_EX<NEAR){S.live=false;clearInterval(tick);setTimeout(()=>finish('end'),1100)}
}

// ---------- results ----------
function finish(why){
  clearInterval(tick);
  if(!S)return;
  const R=S;S=null;
  document.activeElement&&document.activeElement.blur();
  const r=R.r,words=R.chain.map(x=>x.w);
  const res={why,secs:R.secs,total:R.score,used:[...R.used],steps:R.chain,pauses:R.pauses};
  remember(words);
  if(!r.quick){
    store.del('live:'+r.n);
    store.set('v01:'+r.n,res);
    res.badges=awardBadges(res);if(res.badges.length)store.set('v01:'+r.n,res);
    log('play',{puzzle:r.n,words,score:res.total,reached:why==='end',steps:words.length,device:DEVICE});
  }else QUICK=null;
  showResults(r,res);
}
function untilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);
  return`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
async function showResults(r,res){
  clearInterval(tick);
  if(!r.quick&&STATS_FOR!==r.n){await loadStats(r.n);STATS_FOR=r.n}
  const steps=res.steps,used=new Set(res.used);
  const title=r.quick?'Matryo quick play':`Matryo #${pad3(r.n)}`;
  const shareTxt=`${title} · ${TC(r.cat)}\n${steps.map(x=>FIT_BLOCK[x.kind]||'⬜').join('')||'—'}\n${fmt(res.total)} pts · ${steps.length} thing${steps.length===1?'':'s'}\nmatryo.io`;
  const perfect=steps.filter(x=>x.kind==='perfect').length;
  const last=steps.length?steps[steps.length-1].w:r.start;
  const tiny=smallestOnTheme(r);
  const passed=tiny&&EX[last]<=EX[tiny];
  const ended={time:"Time's up",end:'Nothing smaller left!',paused:'Ended by pausing'}[res.why]||"Time's up";
  // the rarest word you played gets its % in orange
  const tags=x=>[FIT_LABEL[x.kind],x.theme>1&&'on theme',x.spec>1&&'specific',x.cool<1&&'played recently'].filter(Boolean).join(' · ');
  // example path: one on-theme thing per size, from the start down to the smallest on-theme thing; yours marked
  const mine=new Map(steps.map(x=>[TIER[x.w],x.w]));
  const byTier={};for(const k of r.theme)if(EX[k]!=null&&!used.has(k))(byTier[TIER[k]]=byTier[TIER[k]]||[]).push(k);
  for(const t in byTier)byTier[t].sort((a,b)=>hasStats()?(STATS[b]||0)-(STATS[a]||0):POP[b]-POP[a]);
  const ladder=[];for(let t=TIER[r.start]-1;t>=(tiny?TIER[tiny]:1);t--){if(mine.has(t))ladder.push({w:mine.get(t),you:true});else if(byTier[t])ladder.push({w:byTier[t][0]})}
  app.innerHTML=`${nav()}<div class="narrow" style="max-width:560px">
    <div class="sumrow in" style="--d:1">
      <div style="display:flex;flex-direction:column;gap:4px"><span class="note">${r.quick?'Quick play':`Daily #${pad3(r.n)}`} · ${esc(TC(r.cat))}</span>
        <b class="score num">${fmt(res.total)}</b><span style="font-size:14px">points · ${esc(ended)}</span></div>
      <div class="r"><span><b class="num">${steps.length}</b> thing${steps.length===1?'':'s'}</span>${perfect?`<span>${perfect} perfect fit${perfect===1?'':'s'}</span>`:''}${r.quick?'':`<span>${streak()} day streak</span>`}</div>
    </div>
    ${(res.badges||[]).length?`<div class="badge-new in" style="--d:2"><b>New badge${res.badges.length>1?'s':''} · ${res.badges.map(id=>BADGES.find(x=>x.id===id).name).join(', ')}</b><span>${res.badges.map(id=>BADGES.find(x=>x.id===id).how).join(' · ')}</span></div>`:''}
    <div class="in" style="--d:2"><div class="eyebrow" style="margin-bottom:4px">Your path</div>
      <div class="path">
        <div class="prow start"><span class="i">·</span><span class="w">${esc(W(r.start))}</span><span>start</span></div>
        ${steps.map((x,i)=>`<div class="prow"><span class="i num">${i+1}</span><span class="w">${esc(W(x.w))} <span class="t">· ${esc(tags(x))}</span>${x.rare>=1.3?` <span class="rare">· ${esc(rareLabel(x.w))}</span>`:''}</span><span class="num">+${x.p}</span></div>`).join('')||'<div class="note" style="padding:8px 0">No words this round. Try again!</div>'}
      </div></div>
    ${tiny?`<div class="in" style="--d:3;display:flex;flex-direction:column;gap:6px"><div class="eyebrow">How small it goes</div>
      <div class="range"><div><b>${esc(W(last))}</b><span>where you stopped</span></div><span class="mut" aria-hidden="true" style="font-size:20px">→</span><div><b>${esc(W(tiny))}</b><span>smallest on theme</span></div></div>
      <div class="note">${passed?`You made it past the smallest ${esc(r.cat.toLowerCase().replace(/^(a|an|the) /,''))} thing on our list.`:`${TIER[last]-TIER[tiny]} more size${TIER[last]-TIER[tiny]===1?'':'s'} to go.`}</div>
      <button class="sq" id="rv" style="align-self:flex-start">Show a typical path</button>
      <div id="lad" hidden><div class="ladder">${ladder.map(x=>`<div class="${x.you?'you':'x'}"><span>${x.you?'› ':''}${esc(W(x.w))}</span><span>${x.you?'yours':''}</span></div>`).join('')}</div></div>
    </div>`:''}
    <div class="share in" style="--d:4" id="sh"><span class="eyebrow">Share preview</span>\n${esc(shareTxt)}</div>
    <button class="btn main in" style="--d:5" id="cp"><span id="cpl">Share results</span>${ICON.copy}</button>
    <div class="two in" style="--d:6"><button class="btn" id="again">Quick play</button><button class="btn" id="homeb">Home</button></div>
    <div class="foot in" style="--d:7">${r.quick?'':`Next daily in <span class="num" id="cd">${untilMidnight()}</span> · `}© 2026 · <a href="${SITE}" target="_blank" rel="noopener">Smidgen Games</a></div>
  </div>`;
  window.scrollTo(0,0);wireNav();
  tick=setInterval(()=>{const cd=document.getElementById('cd');if(cd)cd.textContent=untilMidnight();else clearInterval(tick)},1000);
  document.getElementById('again').onclick=quick;
  document.getElementById('homeb').onclick=showStart;
  const rv=document.getElementById('rv');
  if(rv)rv.onclick=()=>{const l=document.getElementById('lad');l.hidden=!l.hidden;rv.textContent=l.hidden?'Show a typical path':'Hide the typical path'};
  document.getElementById('cp').onclick=async()=>{
    const lab=document.getElementById('cpl');
    try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text:shareTxt});return}}catch(_){}
    try{await navigator.clipboard.writeText(shareTxt);lab.textContent='Copied!'}catch(_){
      const rg=document.createRange();rg.selectNodeContents(document.getElementById('sh'));const s=getSelection();s.removeAllRanges();s.addRange(rg);lab.textContent='Selected: copy it'}
  };
}

// ---------- boot ----------
app.innerHTML='<div class="note" style="padding:40px 0">Loading…</div>';
loadData().then(()=>{
  // a daily left mid-round (tab closed or reloaded) counts as a pause
  const live=liveSaved(TODAY.n);
  if(live&&live.running){live.running=false;live.pauses++;store.set('live:'+TODAY.n,live)}
  if(live&&live.pauses>MAX_PAUSES&&!saved(TODAY.n)){
    S={r:puzzleFor(TODAY),secs:DAILY_SECONDS,cur:live.cur,curEx:live.curEx,chain:live.chain,used:new Set(live.used),score:live.score,pauses:MAX_PAUSES};
    return finish('paused');
  }
  showStart();log('visit',{device:DEVICE});
}).catch(e=>{
  console.error(e);
  app.innerHTML='<div style="padding:40px 0">Could not load the word list.<div class="note">Check that the data folder is published next to this page.</div></div>';
});
</script>
